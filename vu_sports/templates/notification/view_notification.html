{% extends "base.html "%}
{% block content %}


<div class="container mt-4">
    <h3 class="mb-3">Your Notifications</h3>
    <div class="list-group shadow-sm">
        {% for notification in notifications %}
        <div class="list-group-item list-group-item-action py-3 mb-2 border rounded shadow-sm">
            <div class="d-flex w-100 justify-content-between align-items-center">
                <h5 class="mb-1 text-primary">
                    <i class="bi bi-info-circle-fill me-2"></i>{{ notification.title }}
                </h5>
                <small class="text-muted fw-bold">
                    <i class="bi bi-calendar3 me-1"></i>{{ notification.created_at.strftime('%d %B, %Y') }}
                </small>
            </div>
            <p class="mb-1 text-secondary mt-2">
                {{ notification.message }}
            </p>
        </div>
        {% else %}
        <div class="alert alert-light text-center border">
            <p class="mb-0 text-muted">No notifications found.</p>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}

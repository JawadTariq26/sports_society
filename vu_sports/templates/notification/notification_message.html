{% extends "base.html "%}
{% block content %}

<div class="container mt-5">
    
    <!-- Top Row -->
    <div class="row g-4">
        
        <div class="col-md-6">
            <div class="card h-100 border-0 shadow-sm p-3">
                <div class="card-body">
                    <h5 class="card-title fw-bold">Notifications</h5>
                    <p class="card-text text-muted small">Create and manage alerts for users.</p>
                    <a href="{{url_for('notification.create_notification')}}" class="btn btn-primary btn-sm px-4">
                        <i class="bi bi-plus-circle me-1"></i> Create Notification
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card h-100 border-0 shadow-sm p-3">
                <div class="card-body">
                    <h5 class="card-title fw-bold">Direct Messages</h5>
                    <p class="card-text text-muted small">Send a private message to a specific user.</p>
                    <a href="{{url_for('message.send_message_coach')}}" class="btn btn-outline-primary btn-sm px-4">
                        <i class="bi bi-send me-1"></i> Send Message
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center mt-4">
        <div class="col-md-6">
            <div class="card h-100 border-0 shadow-sm p-3 text-center">
                <div class="card-body">
                    <h5 class="card-title fw-bold">Sent Messages</h5>
                    <p class="card-text text-muted small">View messages you have sent.</p>
                    <a href="{{url_for('message.view_sent_message')}}" class="btn btn-outline-dark btn-sm px-4">
                        <i class="bi bi-inbox me-1"></i> View Sent
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>

{% endblock %}

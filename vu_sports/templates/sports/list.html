{% extends "base.html" %}

{% block content %}

<div class="container">
    <h2>Sports List</h2>
    <a href="{{ url_for('sport.create_sport') }}" class="btn btn-primary mb-3">Create New Sport</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for sport in sports %}
            <tr>
                <td>{{ sport.name }}</td>
                <td>
                    <a href="{{ url_for('sport.edit_sport', sport_id=sport.id) }}"
                        class="btn btn-sm btn-warning">Edit</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
